# Generates Crab.xcodeproj: run `xcodegen` after changing this file.
# Source folders are synced, so adding or removing files doesn't need a regenerate.
name: Crab
options:
  bundleIdPrefix: com.tristansmith
  deploymentTarget:
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Sign to run locally; no developer team needed.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  # Everything except the front ends: vm.conf, QEMU command lines, QMP,
  # the release catalog and downloads. Static, so `crab` is a single binary.
  CrabKit:
    type: framework.static
    platform: macOS
    sources:
      - path: CrabKit
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tristansmith.CrabKit
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  # The command-line tool.
  crab:
    type: tool
    platform: macOS
    sources:
      - path: crab
        type: syncedFolder
    dependencies:
      - target: CrabKit
    settings:
      base:
        PRODUCT_NAME: crab
        PRODUCT_BUNDLE_IDENTIFIER: com.tristansmith.crab-cli

  # The SwiftUI app. Ships the CLI at Crab.app/Contents/Helpers/crab.
  Crab:
    type: application
    platform: macOS
    sources:
      - path: Crab
        type: syncedFolder
    dependencies:
      - target: CrabKit
      - target: crab
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: Crab/Info.plist
      properties:
        CFBundleDisplayName: Crab
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        # Downloads may come from plain-HTTP mirrors; every image is checked
        # against the official SHA-256 before it's used.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_NAME: Crab
        PRODUCT_BUNDLE_IDENTIFIER: com.tristansmith.Crab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # crab runs QEMU and manages ~/VMs, which a sandboxed app can't do.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
    scheme:
      testTargets:
        - CrabKitTests

  CrabKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CrabKitTests
        type: syncedFolder
    dependencies:
      - target: CrabKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tristansmith.CrabKitTests
        GENERATE_INFOPLIST_FILE: YES
